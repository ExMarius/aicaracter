name: Verifică cheia API (diagnostic)
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      PANEL_URL: ${{ vars.PANEL_URL || 'https://freepanel.hidencloud.com' }}
      SERVER_ID: ${{ vars.SERVER_ID || 'd496911d' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testează formele de cheie
        env:
          PANEL_API_KEY: ${{ secrets.PANEL_API_KEY }}
        run: node scripts/diag-panel.mjs
