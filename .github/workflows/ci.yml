name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: Teste (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Instalează dependințele
        run: npm ci

      - name: Verifică sintaxa
        run: npm run check

      - name: Rulează testele
        run: npm test
