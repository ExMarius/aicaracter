name: Deploy pe server (plugin + Simple Voice Chat)

# Ce face:
#   1. compilează pluginul Gicu (Paper 1.21.4)
#   2. descarcă ultimul Simple Voice Chat compatibil de pe Modrinth
#   3. le urcă pe server prin API-ul panoului (fără SFTP)
#   4. repornește serverul și citește logul ca să confirme
#
# Un singur secret necesar: PANEL_API_KEY
#   Settings → Secrets and variables → Actions → New repository secret
# Opțional (variabile, nu secrete): PANEL_URL, SERVER_ID
# Ghid: docs/AUTO-DEPLOY.md

on:
  workflow_dispatch:
    inputs:
      restart:
        description: 'Repornește serverul după upload'
        type: boolean
        default: true
      with_svc:
        description: 'Instalează și Simple Voice Chat'
        type: boolean
        default: true
  push:
    branches: ['**']
    paths:
      - 'plugin/**'
      - 'scripts/deploy-api.js'
      - 'scripts/fetch-svc.mjs'
      - '.github/workflows/deploy-server.yml'

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  build:
    name: 1. Compilează pluginul
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build
        working-directory: plugin
        run: gradle build --no-daemon
      - name: Pregătește jar-ul pentru deploy
        run: |
          mkdir -p dist
          cp plugin/build/libs/Gicu-*.jar dist/Gicu.jar
          ls -lh dist/
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-jar
          path: dist/Gicu.jar
          if-no-files-found: error

  deploy:
    name: 2. Urcă pe server
    needs: build
    # deploy real doar de pe main sau manual; pe branch-uri doar se validează build-ul
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      PANEL_URL: ${{ vars.PANEL_URL || 'https://freepanel.hidencloud.com' }}
      SERVER_ID: ${{ vars.SERVER_ID || 'd496911d' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalează dependințele scripturilor
        run: npm ci --no-audit --no-fund

      - uses: actions/download-artifact@v4
        with:
          name: plugin-jar
          path: dist

      - name: Am cheia API?
        id: check
        env:
          PANEL_API_KEY: ${{ secrets.PANEL_API_KEY }}
        run: |
          if [ -z "$PANEL_API_KEY" ]; then
            echo "::warning::Lipsește secretul PANEL_API_KEY — sar peste deploy. Vezi docs/AUTO-DEPLOY.md"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Descarcă Simple Voice Chat
        if: steps.check.outputs.ok == 'true' && (github.event_name != 'workflow_dispatch' || inputs.with_svc)
        continue-on-error: true
        run: node scripts/fetch-svc.mjs dist

      - name: Urcă pluginurile și repornește
        if: steps.check.outputs.ok == 'true'
        env:
          PANEL_API_KEY: ${{ secrets.PANEL_API_KEY }}
        run: |
          ARGS="--file dist/Gicu.jar:plugins/Gicu.jar --verify"
          if [ -f dist/simple-voice-chat.jar ]; then
            ARGS="$ARGS --file dist/simple-voice-chat.jar:plugins/simple-voice-chat.jar"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.restart }}" = "false" ]; then
            ARGS="$ARGS --no-restart"
          else
            ARGS="$ARGS --restart"
          fi
          set +e
          node scripts/deploy-api.js $ARGS 2>&1 | tee /tmp/deploy.log
          CODE=${PIPESTATUS[0]}
          if [ "$CODE" -ne 0 ]; then
            MSG=$(tail -c 1200 /tmp/deploy.log | tr '\n' ' ' | tr -d '\r' | sed 's/%/%25/g')
            echo "::error title=Deploy esuat::$MSG"
            {
              echo "### ❌ Deploy eșuat"
              echo '```'
              tail -25 /tmp/deploy.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Sumar
        if: always()
        run: |
          {
            echo "### Deploy Gicu"
            echo ""
            echo "- plugin: \`plugins/Gicu.jar\`"
            if [ -f dist/simple-voice-chat.jar ]; then
              echo "- voice chat: \`plugins/simple-voice-chat.jar\` ($(cat dist/svc-version.txt 2>/dev/null || echo '?'))"
            else
              echo "- voice chat: neinstalat (descărcarea a eșuat sau a fost oprită)"
            fi
            echo ""
            echo "Dacă serverul nu a repornit: panou → Console → Restart."
          } >> "$GITHUB_STEP_SUMMARY"
