name: Deploy pe server (plugin + Simple Voice Chat)

# Ce face:
#   1. compilează pluginul Gicu (Paper 1.21.4)
#   2. descarcă ultimul Simple Voice Chat compatibil de pe Modrinth
#   3. le urcă pe server prin SFTP
#   4. repornește serverul prin API-ul panoului (Pterodactyl)
#
# Secrete necesare (Settings → Secrets and variables → Actions):
#   SFTP_HOST, SFTP_PORT, SFTP_USER, SFTP_PASS
#   PANEL_URL, SERVER_ID, PANEL_API_KEY   (pentru restart automat)
# Ghid: docs/AUTO-DEPLOY.md

on:
  workflow_dispatch:
    inputs:
      restart:
        description: 'Repornește serverul după upload'
        type: boolean
        default: true
      with_svc:
        description: 'Instalează și Simple Voice Chat'
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - 'plugin/**'
      - 'scripts/deploy-panel.js'
      - 'scripts/fetch-svc.mjs'
      - '.github/workflows/deploy-server.yml'

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  build:
    name: 1. Compilează pluginul
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build
        working-directory: plugin
        run: gradle build --no-daemon
      - name: Pregătește jar-ul pentru deploy
        run: |
          mkdir -p dist
          cp plugin/build/libs/Gicu-*.jar dist/Gicu.jar
          ls -lh dist/
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-jar
          path: dist/Gicu.jar
          if-no-files-found: error

  deploy:
    name: 2. Urcă pe server
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalează dependințele scripturilor
        run: npm ci --no-audit --no-fund

      - uses: actions/download-artifact@v4
        with:
          name: plugin-jar
          path: dist

      - name: Verifică secretele
        id: check
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
        run: |
          if [ -z "$SFTP_HOST" ]; then
            echo "::warning::Secretele SFTP lipsesc — sar peste deploy. Vezi docs/AUTO-DEPLOY.md"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Descarcă Simple Voice Chat
        if: steps.check.outputs.ok == 'true' && (github.event_name != 'workflow_dispatch' || inputs.with_svc)
        run: node scripts/fetch-svc.mjs dist

      - name: Urcă pluginurile
        if: steps.check.outputs.ok == 'true'
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASS: ${{ secrets.SFTP_PASS }}
          PANEL_URL: ${{ secrets.PANEL_URL }}
          SERVER_ID: ${{ secrets.SERVER_ID }}
          PANEL_API_KEY: ${{ secrets.PANEL_API_KEY }}
        run: |
          EXTRA=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.restart }}" = "false" ]; then
            EXTRA="--no-restart"
          fi
          node scripts/deploy-panel.js \
            --file dist/Gicu.jar:plugins/Gicu.jar \
            $([ -f dist/simple-voice-chat.jar ] && echo "--file dist/simple-voice-chat.jar:plugins/simple-voice-chat.jar") \
            $EXTRA

      - name: Sumar
        if: always()
        run: |
          echo "### Deploy Gicu" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- plugin: \`plugins/Gicu.jar\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -f dist/simple-voice-chat.jar ]; then
            echo "- voice chat: \`plugins/simple-voice-chat.jar\` ($(cat dist/svc-version.txt 2>/dev/null || echo '?'))" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Dacă serverul nu a repornit: deschide panoul → Console → Restart." >> "$GITHUB_STEP_SUMMARY"
